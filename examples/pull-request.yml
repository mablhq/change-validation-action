# .github/workflows/mabl-pull-request.yml
# Asks mabl to validate each pull request. To also take `/mabl` comments, see "Comment commands" in the README.
name: mabl pull request
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  mabl:
    permissions:
      contents: read
      pull-requests: read # write, to turn on the comment below
    uses: mablhq/change-validation-action/.github/workflows/pull-request.yml@v1
    with:
      stage: pull_request
      workspace-id: your-workspace-id
      # Keep one comment on the pull request with mabl's report. Read the README before turning it on in a
      # public repository.
      # comment: true
    secrets:
      mabl-api-key: ${{ secrets.MABL_API_KEY }}
