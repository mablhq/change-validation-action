name: mabl change validation (deployed commit, earlier name)

# The earlier name of deployed-commit.yml, kept so workflows that call revision.yml keep working. It passes
# every input through. New callers use deployed-commit.yml, which describes the inputs.

on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
      head-sha:
        type: string
        default: ''
      base-sha:
        type: string
        default: ''
      await:
        type: boolean
        default: false
      status-context:
        type: string
        default: ''
      deadline-minutes:
        type: number
        default: 40
      timeout-minutes:
        type: number
        default: 45
      dry-run:
        type: boolean
        default: false
      file:
        type: string
        default: .mabl/policy.yaml
      workspace-id:
        type: string
        required: true
      api-url:
        type: string
        default: https://api.mabl.com
    secrets:
      mabl-api-key:
        required: true
    outputs:
      outcome:
        value: ${{ jobs.stage-request.outputs.outcome }}
      status:
        value: ${{ jobs.stage-request.outputs.status }}

jobs:
  stage-request:
    uses: ./.github/workflows/deployed-commit.yml
    with:
      stage: ${{ inputs.stage }}
      head-sha: ${{ inputs.head-sha }}
      base-sha: ${{ inputs.base-sha }}
      await: ${{ inputs.await }}
      status-context: ${{ inputs.status-context }}
      deadline-minutes: ${{ inputs.deadline-minutes }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      dry-run: ${{ inputs.dry-run }}
      file: ${{ inputs.file }}
      workspace-id: ${{ inputs.workspace-id }}
      api-url: ${{ inputs.api-url }}
    secrets:
      mabl-api-key: ${{ secrets.mabl-api-key }}
