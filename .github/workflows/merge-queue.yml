name: mabl change validation (merge queue)

# Asks mabl to validate a merge queue entry's stage, waits for the stage's status, and publishes it on the
# queue's commit as the commit status `status-context`. Make that context a required check, not this job: the
# job passes either way, so a rerun or a superseded entry never leaves a red job behind.
#
# Call it on merge_group, from a job that `needs` the one deploying the queue's commit, so the tests run
# against what will merge. With `comment: true` it also updates the pull request's comment with mabl's report once
# the status is published. The calling job grants: contents: read, statuses: write, and pull-requests: read, or
# pull-requests: write with `comment: true`.

on:
  workflow_call:
    inputs:
      stage:
        description: The policy stage to validate
        type: string
        default: merge_queue
      status-context:
        description: The commit status context to publish, the one your branch rules require
        type: string
        required: true
      deadline-minutes:
        description: How long after the stage request to wait before publishing failure, 1 to 120
        type: number
        default: 40
      timeout-minutes:
        description: The job's timeout; keep it at least deadline-minutes + 5
        type: number
        default: 45
      dry-run:
        description: Report what would run without starting any test run
        type: boolean
        default: false
      file:
        description: The policy file's path in the repository
        type: string
        default: .mabl/policy.yaml
      workspace-id:
        description: The id of the mabl workspace to validate in
        type: string
        required: true
      api-url:
        description: The mabl api; https://api.mabl.com is the only one accepted
        type: string
        default: https://api.mabl.com
      comment:
        description: Update the pull request's comment with mabl's report once the status is published; needs pull-requests write
        type: boolean
        default: false
    secrets:
      mabl-api-key:
        description: A mabl API key of the Command Line Interface or Editor type
        required: true
    outputs:
      status:
        description: success or failure, as published; empty when nothing was
        value: ${{ jobs.await.outputs.status }}

jobs:
  await:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      status: ${{ steps.await.outputs.status }}
    steps:
      - id: await
        # The status is the signal; a failed stage shouldn't also fail the job.
        continue-on-error: true
        uses: mablhq/change-validation-action@v1
        with:
          mabl-api-key: ${{ secrets.mabl-api-key }}
          workspace-id: ${{ inputs.workspace-id }}
          api-url: ${{ inputs.api-url }}
          stage: ${{ inputs.stage }}
          dry-run: ${{ inputs.dry-run }}
          file: ${{ inputs.file }}
          await: 'true'
          status-context: ${{ inputs.status-context }}
          deadline-minutes: ${{ inputs.deadline-minutes }}
          comment: ${{ inputs.comment }}
      # The action failed before publishing anything, so the required context would otherwise stay pending
      # until the queue times out.
      - name: Publish error when nothing was published
        if: ${{ !cancelled() && steps.await.outcome == 'failure' && steps.await.outputs.status == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.merge_group.head_sha }}
          CONTEXT: ${{ inputs.status-context }}
          OUTCOME: ${{ steps.await.outputs.outcome }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=error \
            -f context="${CONTEXT}" \
            -f description="mabl change validation ended without a status (${OUTCOME:-failed}); see the job log" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
